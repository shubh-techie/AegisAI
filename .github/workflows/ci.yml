name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore AegisAI.sln

      - name: Build Release
        run: dotnet build AegisAI.sln --configuration Release --no-restore

      - name: Run all tests
        run: dotnet test AegisAI.sln --configuration Release --no-build --no-restore
